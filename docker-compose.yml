services:
  db:
    image: postgres:16-alpine
    container_name: smartcontrole-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcontrole
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smartcontrole-api
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartcontrole?schema=public
      JWT_SECRET: super_secret_change_me
      CORS_ORIGIN: http://localhost:5173
      TZ: America/Sao_Paulo
    depends_on:
      - db
    ports:
      - "3333:3333"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smartcontrole-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3333
      TZ: America/Sao_Paulo
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
